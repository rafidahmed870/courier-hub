name: Bug Report
description: File a bug report to help us improve courier-hub
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what happened and what you expected to happen.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: courier-hub Version
      description: Which version of the package are you using? (You can find this in your package.json)
      placeholder: e.g., 0.1.0
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Install the package
        2. Initialize with ...
        3. Call method ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Error Logs / Code Snippet
      description: Please copy and paste any relevant error logs or the code snippet that caused the issue.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (e.g., OS, Node.js version).
    validations:
      required: false