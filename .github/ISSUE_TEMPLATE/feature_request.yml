name: Feature Request
description: Suggest a new feature or improvement for courier-hub
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest an improvement! Please describe your idea clearly so we can understand and evaluate it.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: Is your feature request related to a problem? Describe the problem or the gap you've identified.
      placeholder: I'm always frustrated when... / There is currently no way to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or improvement you'd like to see. Be as specific as possible.
      placeholder: I would like courier-hub to support...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you've considered.
      placeholder: I tried using... but it doesn't work well because...
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority / Impact
      description: How important is this feature to you?
      options:
        - Critical — blocking my use case
        - High — would significantly improve my workflow
        - Medium — nice to have
        - Low — minor improvement
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example / Code Snippet
      description: Provide an example of how this feature would be used (API shape, config, expected output, etc.).
      render: typescript
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or references that support this feature request.
    validations:
      required: false

